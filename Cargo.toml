[workspace]
resolver = "2"
members = ["compose_rspaced", "crates/rspaced-oci", "crates/rspaced-pack"]

[workspace.package]
edition = "2021"
authors = ["Glenn West"]
license = "MIT"
repository = "https://github.com/glennswest/rspaced"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
flate2 = "1"
tar = "0.4"
vfs = "0.12"
# Consumed from the sibling rspacefs repo (do not author here). Interim path
# dep until rspacefs publishes / we pin a git rev for CI.
rspacefs-verity = { path = "../rspacefs/crates/rspacefs-verity" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
