[workspace]
resolver = "2"
members = ["compose_rspaced", "crates/rspaced-oci", "crates/rspaced-pack", "rspaced_agent"]

[workspace.package]
edition = "2021"
authors = ["Glenn West"]
license = "MIT"
repository = "https://github.com/glennswest/rspaced"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
flate2 = "1"
tar = "0.4"
# Consumed from the rspacefs repo (do not author here). Pinned by git rev so
# downstream consumers (stormcos) can take rspaced-oci/rspaced-pack as git
# deps without a sibling ../rspacefs checkout. Bump the rev deliberately.
rspacefs-verity = { git = "https://github.com/glennswest/rspacefs", rev = "71b44a746d24feb1ddedb9dd7da6381b9d683ad7" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev loop against a local sibling checkout: uncomment (don't commit) or put
# the equivalent in ~/.cargo/config.toml.
# [patch."https://github.com/glennswest/rspacefs"]
# rspacefs-verity = { path = "../rspacefs/crates/rspacefs-verity" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
