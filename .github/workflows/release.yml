name: release

# Builds compose_rspaced and publishes an RPM (native package for the Fedora
# rspaced.g8.lo host) plus a plain-executable tarball as a release on the LOCAL
# cicd — the Forgejo instance on forcicd.g8.lo. NOT github.com (no GH_PAT): the
# runner's own Forgejo token creates the release over the LAN.
#
# Trigger: push a v* tag, or workflow_dispatch with a `tag` input.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish (e.g. v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-publish:
    name: build + publish rpm (x86_64)
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.3

      - name: resolve tag
        id: tag
        run: |
          t="${{ inputs.tag }}"
          [ -z "$t" ] && t="${GITHUB_REF_NAME}"
          echo "name=$t" >>"$GITHUB_OUTPUT"

      - name: build release binary
        run: cargo build --release -p compose_rspaced

      - name: package rpm + tarball
        id: pkg
        run: |
          set -e
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p compose_rspaced
          mkdir -p dist
          # RPM (cargo-generate-rpm writes under target/generate-rpm/)
          rpm=$(ls target/generate-rpm/*.rpm | head -1)
          cp "$rpm" dist/
          # Plain executable tarball as a fallback form.
          out="compose_rspaced-${{ steps.tag.outputs.name }}-x86_64-linux"
          mkdir "$out"
          cp target/release/compose_rspaced "$out/"
          tar -czf "dist/${out}.tar.gz" "$out"
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
          ls -l dist

      - name: publish release to local cicd (Forgejo)
        env:
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -e
          auth="Authorization: token ${TOKEN}"
          # Create the release for this tag (reuse if it already exists).
          rid=$(curl -s -X POST "${API}/repos/${REPO}/releases" -H "${auth}" \
                  -H 'Content-Type: application/json' \
                  -d "{\"tag_name\":\"${TAG}\",\"target_commitish\":\"main\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":true}" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -z "${rid}" ]; then
            rid=$(curl -s "${API}/repos/${REPO}/releases/tags/${TAG}" -H "${auth}" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          fi
          [ -n "${rid}" ] || { echo "could not create/find release for ${TAG}" >&2; exit 1; }
          echo "release id ${rid}"
          for f in dist/*; do
            echo "uploading $(basename "$f")"
            curl -s -X POST "${API}/repos/${REPO}/releases/${rid}/assets?name=$(basename "$f")" \
              -H "${auth}" -F "attachment=@${f}" -o /dev/null -w "  HTTP %{http_code}\n"
          done
          echo "published ${TAG} to ${API%/api/v1}/${REPO}/releases"
