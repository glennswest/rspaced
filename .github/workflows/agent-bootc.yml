name: agent-bootc

# Build the minimal FROM-scratch rspaced_agent bootc image on forcicd's
# bootc-c9s runner (privileged per forcicd#3) and push it to the local
# registry. The kernel is the RHCOS kernel for the specced OCP version, sourced
# from the (authed) rhel-coreos base — so the runner needs the pull secret.
# NEVER bootc-image-builder / coreos-installer.
#
# Prerequisites:
#   - Forgejo secret PULL_SECRET = the OCP pull secret (Docker config.json),
#     so the bootc-c9s runner can pull the rhel-coreos base.
#   - dispatch input `rhcos` = the version-pinned rhel-coreos digest ref.
#
# Dispatch-only (no push trigger) so it never auto-fails before the secret is set.

on:
  workflow_dispatch:
    inputs:
      rhcos:
        description: "version-pinned rhel-coreos ref (quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build from-scratch bootc image (RHCOS kernel)
    if: github.server_url != 'https://github.com'
    runs-on: bootc-c9s
    steps:
      - uses: actions/checkout@v4

      - name: registry auth for the rhel-coreos base
        env:
          PULL_SECRET: ${{ secrets.PULL_SECRET }}
        run: |
          install -d -m700 "$HOME/.config/containers"
          printf '%s' "$PULL_SECRET" > "$HOME/.config/containers/auth.json"

      - name: build (minimal FROM-scratch + RHCOS kernel)
        working-directory: rspaced_agent/bootc
        run: |
          podman build \
            --cap-add=all --security-opt=label=type:container_runtime_t --device /dev/fuse \
            --authfile "$HOME/.config/containers/auth.json" \
            --build-arg RHCOS='${{ inputs.rhcos }}' \
            -t forcicd.g8.lo:5000/rspaced-agent:hello -f Containerfile .

      - name: push to local registry
        run: podman push --tls-verify=false forcicd.g8.lo:5000/rspaced-agent:hello
