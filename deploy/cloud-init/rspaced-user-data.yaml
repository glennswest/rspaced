#cloud-config
# rspaced.g8.lo — Fedora 43 cloud VM: the build/run/control host.
# No source-build tools (cargo/gcc/go live on forcicd); just runtime + the
# image-assembly tools, the compiled compose_rspaced, and the VM-control
# harness. The persistent /data disk holds the store + repos so the OS disk
# can be wiped without losing downloads.

hostname: rspaced
fqdn: rspaced.g8.lo
prefer_fqdn_over_hostname: true

users:
  - name: fedora
    groups: [wheel, adm, systemd-journal]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa  gwest@Glenns-MacBook-Pro.local

ssh_pwauth: false
disable_root: false
package_update: false
packages:
  - qemu-guest-agent
  - git
  - jq

runcmd:
  - [ systemctl, enable, --now, qemu-guest-agent ]
  - [ install, -d, -m, "0700", /root/.ssh ]
  - [ bash, -c, "cp /home/fedora/.ssh/authorized_keys /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys" ]
  # Persistent data disk (scsi1 = /dev/sdb): format ONCE if blank (guarded so a
  # preserved disk is never reformatted), label it, mount /data, persist via
  # LABEL so it remounts after an OS wipe.
  - [ bash, -c, "DEV=/dev/sdb; if ! blkid \"$DEV\" >/dev/null 2>&1; then mkfs.xfs -L rspaced-data \"$DEV\"; fi; mkdir -p /data; grep -q ' /data ' /etc/fstab || echo 'LABEL=rspaced-data /data xfs defaults,nofail 0 2' >> /etc/fstab; mount -a; chown -R fedora:fedora /data" ]

final_message: "rspaced.g8.lo cloud-init complete in $UPTIME seconds"
